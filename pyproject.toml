[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "memory_core"
version = "0.4.0"
description = "Rust-backed memory engine for AI assistants: SQL persistence, in-RAM vector search"
requires-python = ">=3.12"
authors = [
  { name = "Justin" }
]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
]
dependencies = [
    "pydantic>=2.12.4",
    "sqlalchemy>=2.0.44",
]

[project.optional-dependencies]
ann = ["hnswlib>=0.8,<0.9", "numpy>=2,<3"]
dev = [
    "maturin>=1.10.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pyright>=1.1.408",
]
local = [
    "sentence-transformers>=5.4,<6",
]
ai = [
    "pydantic-ai>=1.102.0",
]
mcp = [
    "mcp>=2.3,<3",
]
claude = [
    "claude-agent-sdk>=0.2.176,<0.3",
    "mcp>=2.3,<3",
]

[tool.maturin]
# Mixed Rust/Python layout: the `memory_core/` package at the repo root is the
# Python layer; the compiled extension is mounted inside it as `memory_core._native`.
module-name = "memory_core._native"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["memory_core"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff.lint.flake8-type-checking]
# Pydantic evaluates annotations at runtime; never let the TC rules move their
# imports behind TYPE_CHECKING.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
