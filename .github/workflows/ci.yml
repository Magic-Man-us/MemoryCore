name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "website/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "website/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv run maturin develop --uv

      - name: Tests
        run: uv run pytest -q

      - name: Examples
        working-directory: ${{ runner.temp }}
        run: |
          for example in basic_usage per_user_assistant typed_memory; do
            uv run --project "$GITHUB_WORKSPACE" python "$GITHUB_WORKSPACE/examples/$example.py"
          done
